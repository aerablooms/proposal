<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Convincing the Government Official</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    width:100%;height:100%;
    background:#000;
    font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif;
    overflow:hidden;
  }
  #stage{
    position:relative;
    width:100vw;height:100vh;
    overflow:hidden;
  }
  .bg{
    position:absolute;
    inset:0;
    width:100%;height:100%;
    object-fit:cover;
    opacity:0;
    transition:opacity .6s ease;
  }
  .bg.active{opacity:1;}

  .vignette{
    position:absolute;inset:0;
    background:linear-gradient(180deg, rgba(0,0,0,.15) 0%, rgba(0,0,0,0) 30%, rgba(0,0,0,0) 55%, rgba(0,0,0,.85) 100%);
    pointer-events:none;
  }

  .topbar{
    position:absolute;
    top:0;left:0;right:0;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:22px 34px;
    color:rgba(255,255,255,.55);
    font-size:.7rem;
    letter-spacing:.25em;
    text-transform:uppercase;
    z-index:5;
  }
  .progress-dots{
    display:flex;
    gap:6px;
  }
  .progress-dots span{
    width:7px;height:7px;border-radius:50%;
    background:rgba(255,255,255,.25);
    transition:background .3s;
  }
  .progress-dots span.done{background:#c98a5e;}

  .dialogue-box{
    position:absolute;
    left:50%;
    bottom:22px;
    transform:translateX(-50%);
    width:min(94vw, 1400px);
    padding:12px 30px 14px;
    background:#fffdf6;
    border:3px solid #1b1b22;
    border-radius:16px;
    box-shadow:7px 7px 0 rgba(0,0,0,.55);
    z-index:4;
  }
  .dialogue-box::after{
    content:"";
    position:absolute;
    left:56px;
    bottom:-19px;
    width:0;height:0;
    border:12px solid transparent;
    border-top-color:#1b1b22;
    border-bottom:0;
  }
  .dialogue-box::before{
    content:"";
    position:absolute;
    left:59px;
    bottom:-13px;
    width:0;height:0;
    border:9px solid transparent;
    border-top-color:#fffdf6;
    border-bottom:0;
    z-index:1;
  }
  .dialogue-top{
    display:flex;
    align-items:baseline;
    gap:14px;
    flex-wrap:nowrap;
  }
  .speaker-name{
    display:inline-block;
    flex:0 0 auto;
    font-family:'Trebuchet MS',sans-serif;
    font-size:.62rem;
    letter-spacing:.22em;
    text-transform:uppercase;
    color:#fffdf6;
    background:#8a3b2b;
    padding:4px 12px;
    border-radius:10px;
    font-weight:700;
    white-space:nowrap;
  }
  .line-text{
    color:#1b1b22;
    font-size:1rem;
    line-height:1.42;
    font-family:Georgia,'Noto Serif',serif;
    flex:1 1 auto;
  }
  .continue-hint{
    display:flex;
    justify-content:flex-end;
    margin-top:6px;
    color:#8a3b2b;
    font-family:'Trebuchet MS',sans-serif;
    font-size:.68rem;
    letter-spacing:.16em;
    text-transform:uppercase;
    cursor:pointer;
    user-select:none;
  }
  .continue-hint:hover{color:#5f2a1e;}

  .choices{
    margin-top:10px;
    display:flex;
    flex-direction:row;
    flex-wrap:nowrap;
    gap:10px;
    border-top:3px dashed #1b1b22;
    padding-top:10px;
  }
  .choices .label{
    display:none;
  }
  .choice-option{
    flex:1 1 0;
    display:flex;
    gap:8px;
    align-items:flex-start;
    padding:8px 12px;
    background:#f4efe0;
    border:2px solid #1b1b22;
    border-radius:10px;
    color:#1b1b22;
    font-family:Georgia,'Noto Serif',serif;
    font-size:.82rem;
    line-height:1.3;
    cursor:pointer;
    box-shadow:3px 3px 0 rgba(0,0,0,.3);
    transition:transform .12s, background .12s;
  }
  .choice-option:hover{
    background:#eef4e6;
    transform:translate(-2px,-2px);
    box-shadow:5px 5px 0 rgba(0,0,0,.4);
  }
  .choice-option .opt-tag{
    font-family:'Trebuchet MS',sans-serif;
    font-weight:800;
    color:#8a3b2b;
    flex:0 0 auto;
  }

  #click-catcher{
    position:absolute;inset:0;
    z-index:1;
    cursor:pointer;
  }

  .fade-cover{
    position:absolute;inset:0;
    background:#000;
    z-index:10;
    opacity:0;
    pointer-events:none;
    transition:opacity .35s ease;
  }
  .fade-cover.show{opacity:1; pointer-events:all;}

  @media (max-width:700px){
    .dialogue-box{padding:22px 20px 20px;}
    .line-text{font-size:1.05rem; min-height:60px;}
    .choice-option{font-size:.92rem;}
  }
</style>
</head>
<body>

<div id="stage">
  <img class="bg" id="bg-a" src="" alt="">
  <img class="bg" id="bg-b" src="" alt="">
  <div class="vignette"></div>

  <div class="topbar">
    <span id="scene-title">Chapter One</span>
    <div class="progress-dots" id="progress"></div>
  </div>

  <div id="click-catcher"></div>

  <div class="dialogue-box">
    <div class="dialogue-top">
      <div class="speaker-name" id="speaker"></div>
      <div class="line-text" id="line-text"></div>
    </div>
    <div class="continue-hint" id="continue-hint">Continue ›</div>
    <div class="choices" id="choices" style="display:none;">
      <div id="choice-list" style="display:flex; flex-direction:row; gap:10px; width:100%;"></div>
    </div>
  </div>

  <div class="fade-cover" id="fade-cover"></div>
</div>

<script>
const IMG = {
  front: "https://raw.githubusercontent.com/aerablooms/cip_gov/main/front_building_scene.jpeg",
  lobby: "https://raw.githubusercontent.com/aerablooms/cip_gov/main/secretary_lobby_scene.jpeg",
  rest: "https://raw.githubusercontent.com/aerablooms/cip_gov/main/government_rest_face.jpeg",
  happy: "https://raw.githubusercontent.com/aerablooms/cip_gov/main/government_happy_face.jpeg",
  offended: "https://raw.githubusercontent.com/aerablooms/cip_gov/main/government_offended_face.jpeg",
  signing: "https://raw.githubusercontent.com/aerablooms/cip_gov/main/government_signing_contract.jpeg",
  waiting: "https://raw.githubusercontent.com/aerablooms/cip_gov/main/government_last_scene_waiting_for_the_cooperative_work.jpeg"
};

// Each scene keyed by id. type: "line" (narration/continue) or "choice".
// A choice option's `to` points at a reaction scene (happy/flat/offended),
// and every reaction scene's `next` points at the following main scene.
const scenes = {

  s1: { title:"Chapter One", bg:IMG.front, speaker:"NARRATOR",
    text:"The government building stands ahead. Today is the day the proposal on greenhouse gas emissions gets its hearing.",
    next:"s2" },

  s2: { title:"Chapter One", bg:IMG.lobby, speaker:"SECRETARY",
    text:"The Government is ready for you. Please, this way.",
    next:"s3" },

  s3: { title:"Chapter One", bg:IMG.rest, speaker:"GOVERNMENT OFFICIAL",
    text:"I understand your concerns about greenhouse gas emissions. What would you like me to consider?",
    next:"q1" },

  // ---- Choice Set 1 ----
  q1: { title:"Choice 1 · Renewable Energy", bg:IMG.rest, speaker:"GOVERNMENT OFFICIAL",
    text:"What do you think is the best way to reduce greenhouse gas emissions from power generation?",
    choices:[
      {tag:"A", text:"Investing in renewable energy can reduce emissions while creating jobs and strengthening our energy security.", to:"q1-happy"},
      {tag:"B", text:"We could probably build more renewable energy plants.", to:"q1-flat"},
      {tag:"C", text:"Just shut down every coal power plant immediately.", to:"q1-offended"}
    ]},
  "q1-happy": { title:"Choice 1 · Renewable Energy", bg:IMG.happy, speaker:"GOVERNMENT OFFICIAL",
    text:"That is a well-rounded point — jobs, security, and emissions together. Go on.", next:"q2" },
  "q1-flat": { title:"Choice 1 · Renewable Energy", bg:IMG.rest, speaker:"GOVERNMENT OFFICIAL",
    text:"Vague, but not wrong. I will need more than that eventually.", next:"q2" },
  "q1-offended": { title:"Choice 1 · Renewable Energy", bg:IMG.offended, speaker:"GOVERNMENT OFFICIAL",
    text:"That kind of demand would shut down half the grid overnight. Be realistic.", next:"q2" },

  // ---- Choice Set 2 ----
  q2: { title:"Choice 2 · Government Policies", bg:IMG.rest, speaker:"GOVERNMENT OFFICIAL",
    text:"Why should the government prioritize clean energy?",
    choices:[
      {tag:"A", text:"Policies that support clean energy can protect the environment while encouraging innovation and economic growth.", to:"q2-happy"},
      {tag:"B", text:"Because other countries are already doing it.", to:"q2-flat"},
      {tag:"C", text:"Because it's the government's fault if climate change gets worse.", to:"q2-offended"}
    ]},
  "q2-happy": { title:"Choice 2 · Government Policies", bg:IMG.happy, speaker:"GOVERNMENT OFFICIAL",
    text:"Growth and protection together — that is the argument that moves policy. Continue.", next:"q3" },
  "q2-flat": { title:"Choice 2 · Government Policies", bg:IMG.rest, speaker:"GOVERNMENT OFFICIAL",
    text:"Peer pressure is not a policy rationale, but it is not nothing either.", next:"q3" },
  "q2-offended": { title:"Choice 2 · Government Policies", bg:IMG.offended, speaker:"GOVERNMENT OFFICIAL",
    text:"Placing blame will not get this proposal signed. Try again with something constructive.", next:"q3" },

  // ---- Choice Set 3 ----
  q3: { title:"Choice 3 · Public Support", bg:IMG.rest, speaker:"GOVERNMENT OFFICIAL",
    text:"How can citizens contribute?",
    choices:[
      {tag:"A", text:"Government incentives can encourage households and businesses to adopt cleaner energy.", to:"q3-happy"},
      {tag:"B", text:"People should simply use less electricity.", to:"q3-flat"},
      {tag:"C", text:"Citizens don't have much responsibility; only the government should act.", to:"q3-offended"}
    ]},
  "q3-happy": { title:"Choice 3 · Public Support", bg:IMG.happy, speaker:"GOVERNMENT OFFICIAL",
    text:"Incentives turn intention into action. That I can bring to committee.", next:"s4" },
  "q3-flat": { title:"Choice 3 · Public Support", bg:IMG.rest, speaker:"GOVERNMENT OFFICIAL",
    text:"Asking people to simply do less rarely works without structure behind it.", next:"s4" },
  "q3-offended": { title:"Choice 3 · Public Support", bg:IMG.offended, speaker:"GOVERNMENT OFFICIAL",
    text:"If citizens have no role, why am I hearing this proposal from you at all?", next:"s4" },

  s4: { title:"Chapter Two", bg:IMG.happy, speaker:"GOVERNMENT OFFICIAL",
    text:"You are making reasonable points. Let us continue.", next:"q4" },

  // ---- Choice Set 4 ----
  q4: { title:"Choice 4 · Economy", bg:IMG.happy, speaker:"GOVERNMENT OFFICIAL",
    text:"Some worry that clean energy is too expensive.",
    choices:[
      {tag:"A", text:"Although it requires investment, renewable energy can lower costs over time and reduce environmental damage.", to:"q4-happy"},
      {tag:"B", text:"It might become cheaper in the future.", to:"q4-flat"},
      {tag:"C", text:"Cost doesn't matter if we're helping the environment.", to:"q4-offended"}
    ]},
  "q4-happy": { title:"Choice 4 · Economy", bg:IMG.happy, speaker:"GOVERNMENT OFFICIAL",
    text:"Framed honestly — the upfront cost against the long-term return. Good.", next:"q5" },
  "q4-flat": { title:"Choice 4 · Economy", bg:IMG.rest, speaker:"GOVERNMENT OFFICIAL",
    text:"'Might' will not satisfy the finance committee, but it is a start.", next:"q5" },
  "q4-offended": { title:"Choice 4 · Economy", bg:IMG.offended, speaker:"GOVERNMENT OFFICIAL",
    text:"Cost always matters. Dismiss it again and this meeting ends early.", next:"q5" },

  // ---- Choice Set 5 ----
  q5: { title:"Choice 5 · Long-Term Planning", bg:IMG.happy, speaker:"GOVERNMENT OFFICIAL",
    text:"How should we transition away from fossil fuels?",
    choices:[
      {tag:"A", text:"A gradual transition with investments in renewable energy and modern infrastructure is the most sustainable approach.", to:"q5-happy"},
      {tag:"B", text:"We can reduce fossil fuel use a little each year.", to:"q5-flat"},
      {tag:"C", text:"Stop using fossil fuels tomorrow.", to:"q5-offended"}
    ]},
  "q5-happy": { title:"Choice 5 · Long-Term Planning", bg:IMG.happy, speaker:"GOVERNMENT OFFICIAL",
    text:"Gradual and funded — that is a transition I could actually defend.", next:"q6" },
  "q5-flat": { title:"Choice 5 · Long-Term Planning", bg:IMG.rest, speaker:"GOVERNMENT OFFICIAL",
    text:"A little each year, with no target, is not really a plan.", next:"q6" },
  "q5-offended": { title:"Choice 5 · Long-Term Planning", bg:IMG.offended, speaker:"GOVERNMENT OFFICIAL",
    text:"Tomorrow is not a transition, it is a collapse. I expected better from you.", next:"q6" },

  // ---- Choice Set 6 ----
  q6: { title:"Choice 6 · Innovation", bg:IMG.happy, speaker:"GOVERNMENT OFFICIAL",
    text:"What role does technology play?",
    choices:[
      {tag:"A", text:"Investing in cleaner technologies and energy storage will make renewable energy more reliable.", to:"q6-happy"},
      {tag:"B", text:"Technology will probably improve over time.", to:"q6-flat"},
      {tag:"C", text:"Technology isn't important — we just need fewer power plants.", to:"q6-offended"}
    ]},
  "q6-happy": { title:"Choice 6 · Innovation", bg:IMG.happy, speaker:"GOVERNMENT OFFICIAL",
    text:"Storage is the real bottleneck. Glad someone finally said it.", next:"s5" },
  "q6-flat": { title:"Choice 6 · Innovation", bg:IMG.rest, speaker:"GOVERNMENT OFFICIAL",
    text:"Hoping technology improves is not a strategy I can fund.", next:"s5" },
  "q6-offended": { title:"Choice 6 · Innovation", bg:IMG.offended, speaker:"GOVERNMENT OFFICIAL",
    text:"Dismissing technology outright tells me you have not studied this closely.", next:"s5" },

  s5: { title:"Chapter Three", bg:IMG.offended, speaker:"GOVERNMENT OFFICIAL",
    text:"Convince me this is worth the political cost. Do not waste my time with exaggeration.", next:"q7" },

  // ---- Choice Set 7 ----
  q7: { title:"Choice 7 · Climate Action", bg:IMG.offended, speaker:"GOVERNMENT OFFICIAL",
    text:"Why should climate action be taken now?",
    choices:[
      {tag:"A", text:"Acting now reduces future environmental and economic costs while protecting future generations.", to:"q7-happy"},
      {tag:"B", text:"It's better to start sooner rather than later.", to:"q7-flat"},
      {tag:"C", text:"If we don't act now, everything will be destroyed.", to:"q7-offended"}
    ]},
  "q7-happy": { title:"Choice 7 · Climate Action", bg:IMG.happy, speaker:"GOVERNMENT OFFICIAL",
    text:"Costs now versus costs later — that is language this office understands.", next:"q8" },
  "q7-flat": { title:"Choice 7 · Climate Action", bg:IMG.rest, speaker:"GOVERNMENT OFFICIAL",
    text:"Sooner is better, yes, but you have not told me why it matters.", next:"q8" },
  "q7-offended": { title:"Choice 7 · Climate Action", bg:IMG.offended, speaker:"GOVERNMENT OFFICIAL",
    text:"Doomsday language does not belong in a policy hearing. Stay grounded.", next:"q8" },

  // ---- Choice Set 8 ----
  q8: { title:"Choice 8 · Final Persuasion", bg:IMG.offended, speaker:"GOVERNMENT OFFICIAL",
    text:"Why should I support stronger environmental policies?",
    choices:[
      {tag:"A", text:"Strong environmental policies can balance economic growth, energy security, and climate protection, creating long-term benefits for everyone.", to:"q8-happy"},
      {tag:"B", text:"They could improve our country's reputation.", to:"q8-flat"},
      {tag:"C", text:"Because you don't have any other choice.", to:"q8-offended"}
    ]},
  "q8-happy": { title:"Choice 8 · Final Persuasion", bg:IMG.happy, speaker:"GOVERNMENT OFFICIAL",
    text:"Growth, security, protection — balanced, and defensible. You have convinced me.", next:"resolve" },
  "q8-flat": { title:"Choice 8 · Final Persuasion", bg:IMG.rest, speaker:"GOVERNMENT OFFICIAL",
    text:"Reputation matters, but it is a thin reason to stake my office on.", next:"resolve" },
  "q8-offended": { title:"Choice 8 · Final Persuasion", bg:IMG.offended, speaker:"GOVERNMENT OFFICIAL",
    text:"I do not respond to threats. Choose your words more carefully.", next:"resolve" },

  s6: { title:"Resolution", bg:IMG.happy, speaker:"GOVERNMENT OFFICIAL",
    text:"Your reasoning is sound. Balance, not extremes. I am prepared to move forward.", next:"s7" },

  s7: { title:"Resolution", bg:IMG.signing, speaker:"GOVERNMENT OFFICIAL",
    text:"Let this signature mark the beginning of our cooperation.", next:"s8" },

  s8: { title:"Final Scene", bg:IMG.waiting, speaker:"GOVERNMENT OFFICIAL",
    text:"Now the real work begins. I will be watching for results.", next:"s9" },

  s9: { title:"End of Chapter One", bg:IMG.waiting, speaker:"NARRATOR",
    text:"The negotiation is over. What follows depends on how well words become action." },

  // ---- Failure ending: too many offended reactions ----
  b1: { title:"Rejected", bg:IMG.offended, speaker:"GOVERNMENT OFFICIAL",
    text:"I have heard enough. Too much of this proposal was carelessly argued for me to stake my office on it.", next:"b2" },

  b2: { title:"Rejected", bg:IMG.offended, speaker:"GOVERNMENT OFFICIAL",
    text:"Come back when you have a case built on substance, not assumptions. This meeting is over.", next:"b3" },

  b3: { title:"End of Chapter One", bg:IMG.lobby, speaker:"NARRATOR",
    text:"The proposal is denied. The doors close behind you, and the greenhouse gas policy goes nowhere — for now." }
};

const sceneOrder = ["s1","s2","s3","q1","q1-happy","q1-flat","q1-offended","q2","q2-happy","q2-flat","q2-offended",
"q3","q3-happy","q3-flat","q3-offended","s4","q4","q4-happy","q4-flat","q4-offended","q5","q5-happy","q5-flat","q5-offended",
"q6","q6-happy","q6-flat","q6-offended","s5","q7","q7-happy","q7-flat","q7-offended","q8","q8-happy","q8-flat","q8-offended",
"s6","s7","s8","s9"];
// Progress dots track how far the linear "main path" has gone (choice reaction scenes don't add dots).
const mainPath = ["s1","s2","s3","q1","q2","q3","s4","q4","q5","q6","s5","q7","q8","s6","s7","s8","s9"];

let current = "s1";
let usingA = true;
let happyCount = 0;
let flatCount = 0;
let offendedCount = 0;
const bgA = document.getElementById('bg-a');
const bgB = document.getElementById('bg-b');
const sceneTitle = document.getElementById('scene-title');
const speakerEl = document.getElementById('speaker');
const lineTextEl = document.getElementById('line-text');
const continueHint = document.getElementById('continue-hint');
const choicesWrap = document.getElementById('choices');
const choiceList = document.getElementById('choice-list');
const progress = document.getElementById('progress');
const clickCatcher = document.getElementById('click-catcher');

function buildProgress(){
  progress.innerHTML = '';
  const idx = mainPath.indexOf(current);
  const effectiveIdx = idx === -1 ? mainPath.findIndex(id => id > current) : idx;
  mainPath.forEach((id, i) => {
    const dot = document.createElement('span');
    if(mainPath.indexOf(current) !== -1 ? i <= idx : false) dot.classList.add('done');
    progress.appendChild(dot);
  });
}

function setBackground(src){
  const showEl = usingA ? bgB : bgA;
  const hideEl = usingA ? bgA : bgB;
  showEl.src = src;
  showEl.onload = () => {
    showEl.classList.add('active');
    hideEl.classList.remove('active');
  };
  usingA = !usingA;
}

function shuffle(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function renderScene(){
  const s = scenes[current];
  sceneTitle.textContent = s.title;
  speakerEl.textContent = s.speaker;
  lineTextEl.textContent = s.text;
  setBackground(s.bg);
  buildProgress();

  if(s.choices){
    choicesWrap.style.display = 'flex';
    continueHint.style.display = 'none';
    choiceList.innerHTML = '';
    const letters = ['A','B','C','D','E'];
    const shuffled = shuffle(s.choices);
    shuffled.forEach((c, i) => {
      const div = document.createElement('div');
      div.className = 'choice-option';
      const tagSpan = document.createElement('span');
      tagSpan.className = 'opt-tag';
      tagSpan.textContent = letters[i] + '.';
      const textSpan = document.createElement('span');
      textSpan.textContent = c.text;
      div.appendChild(tagSpan);
      div.appendChild(textSpan);
      div.addEventListener('click', (e) => {
        e.stopPropagation();
        if(c.to.endsWith('happy')) happyCount++;
        else if(c.to.endsWith('flat')) flatCount++;
        else if(c.to.endsWith('offended')) offendedCount++;
        current = c.to;
        renderScene();
      });
      choiceList.appendChild(div);
    });
  } else {
    choicesWrap.style.display = 'none';
    continueHint.style.display = s.next ? 'flex' : 'none';
  }
}

function advance(){
  const s = scenes[current];
  if(s.next){
    if(s.next === 'resolve'){
      const goodCount = happyCount + flatCount;
      current = (goodCount >= 5) ? 's6' : 'b1';
    } else {
      current = s.next;
    }
    renderScene();
  }
}

clickCatcher.addEventListener('click', () => {
  const s = scenes[current];
  if(!s.choices) advance();
});
continueHint.addEventListener('click', (e) => {
  e.stopPropagation();
  advance();
});

document.addEventListener('keydown', (e) => {
  if(e.key === 'Enter' || e.key === ' ' || e.key === 'ArrowRight'){
    const s = scenes[current];
    if(!s.choices) advance();
  }
});

renderScene();
</script>


</body>
</html>
